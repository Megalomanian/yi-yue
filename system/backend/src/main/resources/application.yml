server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
mybatis-plus:
  configuration:
    call-setters-on-nulls: true
    local-cache-scope: statement
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/instrumenthub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=30000}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
management:
  health:
    redis:
      enabled: ${REDIS_LOCK:false}
  endpoints:
    web:
      exposure:
        include: health,info
app:
  demo: ${DEMO_MODE:true}
  jwt-secret: ${JWT_SECRET:local-demo-only-change-before-deployment-2026}
  encryption-key: ${ENCRYPTION_KEY:local-demo-encryption-key-change-before-deployment}
  redis-lock: ${REDIS_LOCK:false}
  confirmation-minutes: ${CONFIRMATION_MINUTES:5}
  storage: ${STORAGE:local}
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  minio-user: ${MINIO_USER:instrumenthub}
  minio-password: ${MINIO_PASSWORD:}
  minio-bucket: instrumenthub
  seed-password: ${SEED_PASSWORD:Demo12345!}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  sso-url: ${SSO_EXCHANGE_URL:}
  sso-token: ${SSO_SERVICE_TOKEN:}
  notification-gateway: ${NOTIFICATION_GATEWAY_URL:}
  upstream-gateway: ${UPSTREAM_GATEWAY_URL:}
  gateway-token: ${GATEWAY_TOKEN:}
