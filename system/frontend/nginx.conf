server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 60s; }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location /swagger-ui { proxy_pass http://backend:8080; }
}
