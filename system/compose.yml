name: instrumenthub
services:
  mysql:
    image: mysql:8.0.41
    environment:
      MYSQL_DATABASE: instrumenthub
      MYSQL_USER: instrumenthub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--innodb-buffer-pool-size=256M",
      ]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    mem_limit: 768m
  redis:
    image: redis:7.4.2-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD}",
      ]
    environment: { REDISCLI_AUTH: "${REDIS_PASSWORD}" }
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 10s,
        timeout: 3s,
        retries: 10,
      }
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    mem_limit: 192m
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: instrumenthub
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    volumes: ["minio-data:/data"]
    restart: unless-stopped
    mem_limit: 512m
  backend:
    build: ./backend
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/instrumenthub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: instrumenthub
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_LOCK: "true"
      STORAGE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: instrumenthub
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      SSO_EXCHANGE_URL: ${SSO_EXCHANGE_URL:-}
      SSO_SERVICE_TOKEN: ${SSO_SERVICE_TOKEN:-}
      NOTIFICATION_GATEWAY_URL: ${NOTIFICATION_GATEWAY_URL:-}
      UPSTREAM_GATEWAY_URL: ${UPSTREAM_GATEWAY_URL:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/actuator/health",
        ]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    mem_limit: 1200m
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
volumes:
  mysql-data:
  redis-data:
  minio-data:
